<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Bouvet Island — Kontroller</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="screen-connecting" class="screen">
      <p>Kobler til Bouvet Island…</p>
    </div>

    <div id="screen-queued" class="screen hidden">
      <p>Du står i kø</p>
      <div class="queue-position">–</div>
      <p class="hint">Du slipper inn automatisk når det er din tur</p>
    </div>

    <div id="screen-active" class="screen hidden">
      <div class="top-bar">
        <div class="player-badge">#?</div>
        <div class="lives">
          <div class="lives-hearts"></div>
          <div class="lives-score">POENG: 0</div>
        </div>
        <canvas class="minimap" width="100" height="70"></canvas>
      </div>

      <div class="play-area">
        <div class="joystick">
          <div class="joystick-ring">
            <div class="joystick-thumb"></div>
          </div>
        </div>

        <div class="action-buttons">
          <button class="btn-powerup">POWERUP</button>
          <button class="btn-hit">SLÅ</button>
        </div>
      </div>
    </div>

    <div id="rotate-hint">
      <p>Roter telefonen<br />til liggende modus</p>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
